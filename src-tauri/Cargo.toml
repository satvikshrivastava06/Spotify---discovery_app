[package]
name = "app"
version = "0.1.0"
description = "Spotify Discovery Companion"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"

# Windows-only: official Microsoft-maintained WinRT bindings, used for the
# System Media Transport Controls API in media/windows.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
] }

# macOS-only: CFDictionary/CFString bridging and dlopen/dlsym for the
# private MediaRemote framework in media/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
libc = "0.2"

[dev-dependencies]
serde_json = "1"

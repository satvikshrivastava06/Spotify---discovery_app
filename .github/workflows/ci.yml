name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-check:
    name: Security regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/security-check.sh

  # Runs on Windows and macOS specifically because those are the two
  # platforms this app targets (Phase 0) — matches the release matrix in
  # release.yml. Unlike the frontend job above, these steps have never
  # actually been executed anywhere in this project's history: no Rust
  # toolchain was available in the environment this codebase was built
  # in. This job is what closes that gap — the first real compile check
  # the Rust code gets.
  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo check
      - run: cargo test
